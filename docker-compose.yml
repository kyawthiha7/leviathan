services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leviathan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leviathan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leviathan} -d ${POSTGRES_DB:-leviathan}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  leviathan:
    # Built locally from source by default (Dockerfile.local), so this works
    # on any machine with just Docker installed — no dependency on a
    # prebuilt image being published to a registry. If a released image tag
    # is available and you'd rather use that, run with `--no-build` or set
    # LEVIATHAN_TAG and run `docker compose pull leviathan` first.
    image: leviathan:${LEVIATHAN_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEVIATHAN_PG_DSN: postgres://${POSTGRES_USER:-leviathan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leviathan}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LEVIATHAN_LLM_PROVIDER: ${LEVIATHAN_LLM_PROVIDER:-}
      LEVIATHAN_LLM_MODEL: ${LEVIATHAN_LLM_MODEL:-}
      LEVIATHAN_LLM_BASE_URL: ${LEVIATHAN_LLM_BASE_URL:-}
      LEVIATHAN_LLM_PROXY: ${LEVIATHAN_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to ./data in the
      # project root, so it's easy to inspect/back up from the host and
      # survives container rebuilds.
      - ./data:/app/data
      # Mount the project root's skills/ into the container (overriding the
      # image's built-in /app/skills); editing a skill doesn't require
      # rebuilding the image, since the container reads straight from the host.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
