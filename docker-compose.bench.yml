# LEVIATHAN Tencent TSec Benchmark evaluation image — local one-click build + run.
# Independent of the production docker-compose.yml (multi-service: leviathan+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in foreground (see logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # run in background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also remove the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  leviathan-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: leviathan-bench:latest
    container_name: leviathan-bench
    env_file:
      - bench/.env
    # Shares the network with the host machine: the container uses the host's
    # network stack directly, so it can reach target networks on the
    # host/VPN. In host mode there's no `ports` mapping — the container binds
    # host ports directly: 8787 (UI/API), 8788 (proxy), and the internal
    # PostgreSQL's 5432 — make sure these three ports are free on the host
    # (stop anything using them before testing locally).
    # NOTE: `network_mode: host` is Linux-only; Docker Desktop on Windows/macOS
    # does not support it. Benchmarking is intended to run on a Linux host.
    network_mode: host
    restart: "no"

volumes:
  leviathan_bench_data:
