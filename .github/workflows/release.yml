name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the Release

jobs:
  # ① Export the frontend statically (once); the output is reused across all cross-compiled platforms
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Cross-compile for five platforms (frontend embedded) + package as zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          LEVIATHAN_TARGET_OS: ${{ matrix.goos }}
          LEVIATHAN_TARGET_ARCH: ${{ matrix.goarch }}
          LEVIATHAN_BUILD_VERSION: ${{ github.ref_name }}
          LEVIATHAN_SKIP_FRONTEND: "1"
          LEVIATHAN_SKIP_NPM_CI: "1"
          # Self-extracting UPX ELF binaries can crash under some Linux
          # kernels, virtualization setups, and security policies. Releases
          # use Go linker stripping plus zip compression instead, to
          # prioritize portability.
          LEVIATHAN_COMPRESS: "0"
          LEVIATHAN_PACKAGE: "1"
          LEVIATHAN_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${LEVIATHAN_TARGET_OS}/${LEVIATHAN_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/leviathan-linux-amd64/leviathan -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload the raw Linux binary separately so the docker job can reuse it
      # (avoids recompiling the frontend+Go inside the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/leviathan-linux-${{ matrix.goarch }}/leviathan

  # ③ Gather all zips → create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # ④ Multi-arch image → push to Docker Hub (reuses the Linux binaries built
  #    by the `binaries` job; the image just installs tools and drops in the
  #    binary — arm64 only needs to emulate the apt layer, which is much faster)
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: autumn27/leviathan
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
